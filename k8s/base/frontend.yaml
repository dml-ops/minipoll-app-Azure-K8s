apiVersion: v1
kind: ConfigMap
metadata: { name: frontend-config, namespace: frontend }
data:
  BACKEND_HOST: backend.backend.svc.cluster.local:3000   # where Nginx forwards /api
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: minipoll-frontend:dev
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: frontend-config }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: frontend }
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 8080 }]
