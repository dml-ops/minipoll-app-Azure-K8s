apiVersion: v1
kind: ConfigMap                      # plain settings (like environment in the task definition)
metadata: { name: backend-config, namespace: backend }
data:
  DB_HOST: postgres.database.svc.cluster.local    # service.namespace.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: minipoll
  DB_SSL: "false"                    # "true" on Azure (the same SSL fix as your RDS error)
  ENABLE_DEBUG: "true"               # turns on /api/debug/burn and /api/debug/crash for demos
---
apiVersion: apps/v1
kind: Deployment                     # keeps N copies running (like an ECS service)
metadata: { name: backend, namespace: backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0              # never remove an old pod before a new one is ready
      maxSurge: 1
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: minipoll-backend:dev
          ports: [{ containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef: { name: db-credentials }   # you create this with a command, never in Git
          resources:
            requests: { cpu: 100m, memory: 128Mi }  # what the pod is guaranteed (the HPA measures against this)
            limits:   { cpu: 300m, memory: 256Mi }  # the ceiling
          livenessProbe:             # "is it stuck?" If it fails, the container is restarted
            httpGet: { path: /api/healthz, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:            # "can it take traffic?" If it fails, it is removed from the Service
            httpGet: { path: /api/readyz, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service                        # stable internal address (like a target group, internal only)
metadata: { name: backend, namespace: backend }
spec:
  type: ClusterIP
  selector: { app: backend }
  ports: [{ port: 3000, targetPort: 3000 }]

