resources:
  - ../../base

images:
  - name: minipoll-backend
    newName: "**minipollacr4vvuo.azurecr.io**/minipoll-backend"
    newTag: "**IMAGE_TAG**"
  - name: minipoll-frontend
    newName: "**minipollacr4vvuo.azurecr.io**/minipoll-frontend"
    newTag: "**IMAGE_TAG**"

patches:
  - target: { kind: Ingress, name: minipoll }
    patch: |-
      - op: replace
        path: /spec/ingressClassName
        value: webapprouting.kubernetes.azure.com
  - target: { kind: ConfigMap, name: backend-config }
    patch: |-
      - op: replace
        path: /data/DB_HOST
        value: "**minipoll-pg-4vvuo.postgres.database.azure.com**"
      - op: replace
        path: /data/DB_SSL
        value: "true"
